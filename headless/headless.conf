# Minimal config for the separate, headless Sway session used by AOTR.
# This deliberately does not load the user's normal Sway config or autostart.
# Start XWayland immediately so `swaymsg exec` has a DISPLAY to pass to Flatpak.
xwayland force

output HEADLESS-1 mode --custom 1920x1080@120Hz

# Keep this session free of compositor shortcuts that could consume game keys.
focus_follows_mouse no

# The headless backend has no physical devices, so explicitly attach WayVNC's
# protocol input devices to the seat that owns Sober's focus.
seat seat0 attach *
